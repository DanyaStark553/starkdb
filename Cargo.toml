[package]
name = "starkdb"
version = "1.0.0"
edition = "2021"
authors = ["Danya <starkos>"]
description = "StarkDB: Ultimate Legacy — High-Performance Open-Source Hybrid Vector (HNSW SQ8), Lexical (BM25F) & Associative Graph Database"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["database", "vector-search", "graph-database", "hnsw", "bm25"]
categories = ["database-implementations", "data-structures", "algorithms"]

[dependencies]
memmap2 = "0.9"
bytemuck = { version = "1.18", features = ["derive"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
crc32fast = "1.4"
fs2 = "0.4"
half = { version = "2.4", default-features = false, features = ["bytemuck"] }
hashbrown = "0.15"
smallvec = "1.13"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "stark_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
