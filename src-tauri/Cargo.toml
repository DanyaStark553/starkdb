[package]
name = "starkdb-workbench"
version = "0.2.0"
description = "StarkDB Workbench // Victory Boost"
authors = ["Danya <starkos>"]
edition = "2021"

[lib]
name = "starkdb_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
